# Timer, one game; the cube button is held over the end of the game, then released.
name: timer, cube button held when the game ends
ticks: 3600
setup:
  containers:
    - pos: [4, 1, 7]
      items: [{id: minecraft:cobblestone, count: 188}]
actions:
  - {at: 20, press: [9, 2, 3]}          # START
  # cube button held from well before to well after the end of the game (bell at 3042 in
  # the simulator), so a small timing difference in the real game still lands inside it
  - {at: 2700, hold: [9, 2, 9], for: 700}
watch:
  - {pos: [5, 1, 3], label: bulb}
  - {pos: [4, 1, 7], label: hopper A}
  - {pos: [5, 1, 7], label: hopper B}
  - {pos: [3, 1, 7], label: comparator reading A}
  - {pos: [2, 1, 6], label: end-of-half torch}
  - {pos: [6, 1, 7], label: comparator reading B}
  - {pos: [10, 1, 7], label: bell torch}
  - {pos: [12, 1, 7], label: bell}
  - {pos: [10, 1, 8], label: gate lock}
  - {pos: [10, 1, 9], label: cube gate}
  - {pos: [12, 1, 9], label: dispenser}
expect:
  - {events: bell, count: 1}
  - {at: 0, pos: [12, 1, 7], powered: true}       # idle and armed after placing (#38)
  - {at: 120, pos: [5, 1, 3], lit: true}          # the round is running: bulb toggled on
  - {at: 120, pos: [12, 1, 7], powered: false}    # ... and hopper B holds items
  - {at: 2710, pos: [10, 1, 9], powered: true}    # the press reached the gate (open)
  - {at: 3500, pos: [10, 1, 9], powered: false}   # gate closed after the game
